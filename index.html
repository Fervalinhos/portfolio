<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Fervalinhos · Portfólio</title>
    <meta name="description" content="Portfólio de projetos e contribuições open source de Fervalinhos." />

    <!-- Prévia ao compartilhar o link no LinkedIn e em outras redes -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Fervalinhos · Portfólio" />
    <meta property="og:description" content="Projetos, tecnologias e contribuições open source." />
    <meta property="og:image" content="https://github.com/Fervalinhos.png?size=400" />
    <meta name="twitter:card" content="summary" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700;1,800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Aplica o tema salvo antes do primeiro render para evitar "piscar".
      try {
        var saved = localStorage.getItem('theme')
        var root = document.documentElement
        root.dataset.theme =
          saved || root.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
